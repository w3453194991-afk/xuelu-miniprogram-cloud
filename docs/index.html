<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>学鹭伴学 · 陪伴每一次成长</title><meta name="description" content="学鹭伴学 - 为家庭连接课程、家教、机构与校车接送服务"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌱</text></svg>"><style>
:root{
  --brand:#ff7a18;--brand2:#ffab2e;--brand3:#ffcb63;
  --soft:#fff4e9;--ink:#1f1f1f;--sub:#8b8b8b;--line:#efefef;--bg:#f4f4f4;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#e9e6e0;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid #c2560a;outline-offset:2px}

/* ---------- 手机外壳 ---------- */
.phone{width:390px;height:820px;max-height:calc(100vh - 48px);background:var(--bg);position:relative;border:9px solid #111;border-radius:44px;overflow:hidden;box-shadow:0 24px 60px rgba(60,40,20,.28);display:flex;flex-direction:column}

/* ---------- 滚动区 ---------- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------- 顶部品牌区 ---------- */
.hero{background:linear-gradient(158deg,#ff8a1e 0%,#ffab2e 46%,#ffcb63 100%);padding-bottom:12px}
.statusbar{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;font-weight:700;color:#fff}
.statusbar .sicons{letter-spacing:1px}

.locrow{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px;color:#fff}
.loc{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700;max-width:60%}
.loc .pin{font-size:13px}
.loc .caret{font-size:10px;opacity:.85}
.locacts{display:flex;align-items:center;gap:6px}
.ibtn{position:relative;width:34px;height:34px;display:grid;place-items:center;font-size:19px;color:#fff;border-radius:50%}
.ibtn:active{background:rgba(255,255,255,.18)}
.ibtn .dot{position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:9px;background:#ff3b30;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1;font-style:normal}

.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;margin:0 16px;padding:5px 5px 5px 14px;box-shadow:0 2px 8px rgba(180,100,0,.10)}
.searchbar .mag{font-size:16px;color:#b9b9b9;line-height:1}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:13px;padding:5px 0}
.searchbar input::placeholder{color:#b5b5b5}
.gobtn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:7px 18px;flex-shrink:0}
.gobtn:active{filter:brightness(.94)}

/* ---------- 宫格卡片 ---------- */
.panel{background:#fff;margin:12px 10px 0;border-radius:16px;padding:6px 4px 8px;box-shadow:0 4px 16px rgba(180,100,0,.13)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);row-gap:14px;padding:10px 2px 4px}
.gitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.gico{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;font-size:23px;transition:transform .16s}
.gitem:active .gico{transform:scale(.92)}
.gitem b{font-size:11px;font-weight:400;color:#3d3d3d;white-space:nowrap;letter-spacing:-.2px}
.t0{background:#fff0e0}.t1{background:#e8f3ff}.t2{background:#e9f9ec}.t3{background:#ffeef4}.t4{background:#f2edff}
.pdots{display:flex;justify-content:center;gap:4px;padding-top:2px}
.pdots i{width:12px;height:3px;border-radius:2px;background:#ffd9b3}
.pdots i.on{background:var(--brand)}

/* ---------- 内容区 ---------- */
.body{padding:10px 10px 16px;background:var(--bg)}

/* Banner 卡 */
.bcard{background:#fff;border-radius:16px;padding:12px;display:flex;align-items:center;gap:11px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);position:relative;overflow:hidden}
.bcard .bimg{width:56px;height:56px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:27px;background:linear-gradient(135deg,#ffd9b8,#ffb877)}
.bcard .bmain{flex:1;min-width:0}
.bcard h3{font-size:14px;font-weight:700;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard p{margin:0;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .bgo{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:7px 17px;flex-shrink:0}
.bdots{display:flex;justify-content:center;gap:4px;margin:-4px 0 12px}
.bdots i{width:12px;height:3px;border-radius:2px;background:#dcdcdc}
.bdots i.on{background:var(--brand)}

/* AI 卡 */
.aicard{background:linear-gradient(135deg,#fff8f1,#fff);border:1px solid #ffe3c9;border-radius:16px;padding:13px;margin-bottom:12px}
.aihead{display:flex;align-items:center;gap:10px}
.aihead .aiav{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--brand),var(--brand2));flex-shrink:0}
.aihead b{display:block;font-size:14px}
.aihead small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.aichips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.aichips button{background:#fff;border:1px solid #ffdcbc;color:#a75a10;font-size:11px;border-radius:999px;padding:6px 11px;transition:.16s}
.aichips button:active{background:var(--soft)}

/* 段落标题 */
.sechead{display:flex;align-items:baseline;justify-content:space-between;padding:4px 2px 10px}
.sechead h2{font-size:16px;margin:0;font-weight:800;letter-spacing:-.3px}
.sechead h2 .sectitle{font-size:16px;font-weight:800;color:var(--ink)}
.sechead h2 span{font-size:11px;font-weight:400;color:var(--sub);margin-left:5px}
.sechead button{font-size:11px;color:var(--sub)}
.sechead button:active{color:var(--brand)}

/* ---------- 双列瀑布 ---------- */
.waterfall{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}
.wcol{display:flex;flex-direction:column;gap:9px;min-width:0}
.wcard{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.055);transition:transform .16s}
.wcard:active{transform:scale(.975)}
.wimg{position:relative;display:grid;place-items:center;font-size:44px}
.wimg.h1{height:132px}.wimg.h2{height:106px}.wimg.h3{height:152px}.wimg.h4{height:120px}
.wbadge{position:absolute;left:7px;top:7px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;backdrop-filter:blur(3px)}
.wbadge.hot{background:linear-gradient(135deg,#ff5722,#ff8a3d)}
.wlive{position:absolute;left:7px;top:7px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 7px;border-radius:6px}
.wlive em{width:5px;height:5px;border-radius:50%;background:#ff3b30;font-style:normal;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.wbody{padding:9px 9px 10px}
.wbody h4{font-size:12.5px;font-weight:600;margin:0 0 5px;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wmeta{font-size:10px;color:var(--sub);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wprice{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.wprice b{color:#ff4d00;font-size:16px;font-weight:800;letter-spacing:-.4px}
.wprice b i{font-size:10px;font-style:normal;font-weight:700;margin-right:1px}
.wprice s{color:#b9b9b9;font-size:10px;text-decoration:line-through}
.wprice em{background:#fff0e6;color:#ff5c00;font-size:9.5px;font-style:normal;padding:1px 4px;border-radius:3px;font-weight:700}

/* 色块 */
.k1{background:linear-gradient(135deg,#ffd9b8,#ffb877)}
.k2{background:linear-gradient(135deg,#d5e4ff,#a9c6ff)}
.k3{background:linear-gradient(135deg,#d3f5da,#a5e7b4)}
.k4{background:linear-gradient(135deg,#ffd6e6,#ffa9c9)}
.k5{background:linear-gradient(135deg,#e4dbff,#c3b0ff)}
.k6{background:linear-gradient(135deg,#fff0b8,#ffdb6b)}

/* ---------- 次级页面头部 ---------- */
.subhead{background:linear-gradient(158deg,#ff8a1e,#ffab2e 60%,#ffcb63);padding:0 0 16px;color:#fff}
.subhead .statusbar{color:#fff}
.subhead .tbar{display:flex;align-items:center;gap:10px;padding:6px 16px 2px}
.subhead h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.4px}
.subhead p{margin:6px 16px 0;font-size:11.5px;opacity:.92}

/* ---------- 列表卡 ---------- */
.listcard{background:#fff;border-radius:14px;padding:12px;display:flex;gap:11px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.listcard .limg{width:74px;height:74px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:32px}
.listcard .lmain{flex:1;min-width:0}
.listcard h3{font-size:14px;margin:0 0 4px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listcard .lsub{font-size:11px;color:var(--sub);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipsrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.chipsrow span{background:#f6f6f6;color:#666;font-size:10px;padding:2px 6px;border-radius:4px}
.lfoot{display:flex;align-items:flex-end;justify-content:space-between}
.lfoot .pr b{color:#ff4d00;font-size:17px;font-weight:800}
.lfoot .pr b i{font-size:10px;font-style:normal}
.lfoot .pr small{color:#aaa;font-size:10px;font-weight:400}
.lfoot .savebtn{background:var(--soft);color:var(--brand);font-size:11px;font-weight:700;border-radius:999px;padding:6px 13px}
.lfoot .savebtn.on{background:var(--brand);color:#fff}

/* 我的 */
.profilehead{background:linear-gradient(158deg,#ff8a1e,#ffab2e 60%,#ffcb63);padding:0 0 40px;color:#fff}
.pcard{background:#fff;border-radius:16px;margin:-30px 10px 12px;padding:16px;display:flex;align-items:center;gap:13px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.pcard .pav{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--brand),var(--brand2));flex-shrink:0}
.pcard h2{margin:0 0 3px;font-size:16px}
.pcard p{margin:0;font-size:11.5px;color:var(--sub)}
.statrow{display:flex;background:#fff;border-radius:14px;margin:0 10px 12px;padding:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.statrow div{flex:1;text-align:center;border-right:1px solid var(--line)}
.statrow div:last-child{border:0}
.statrow b{display:block;font-size:17px;color:var(--brand)}
.statrow span{font-size:11px;color:var(--sub)}
.mineblock{background:#fff;border-radius:14px;margin:0 10px 12px;padding:4px 14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mrow:last-child{border:0}
.mrow .rt{color:#bdbdbd;font-size:12px}
.mrow .lf{display:flex;align-items:center;gap:9px}
.mrow .lf span{font-size:17px}

.empty{text-align:center;padding:44px 16px;color:#a4a4a4;font-size:13px}
.empty .eico{font-size:38px;display:block;margin-bottom:10px;opacity:.75}

.notice{font-size:10px;color:#b3ada5;text-align:center;margin:16px 0 4px;line-height:1.7}

/* ---------- 底部导航 ---------- */
.tabbar{flex-shrink:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:7px 0 9px;position:relative;z-index:4}
.tabbar button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9e9e9e;font-size:10.5px;transition:color .22s}
.tabbar button::before{content:'';position:absolute;left:50%;top:1px;width:48px;height:36px;transform:translateX(-50%) scale(.65);border-radius:50%;opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;background:radial-gradient(circle,rgba(255,140,30,.40) 0%,rgba(255,140,30,.16) 45%,rgba(255,140,30,0) 72%)}
.tabbar button.active::before{opacity:1;transform:translateX(-50%) scale(1)}
.tabbar .tico{position:relative;z-index:1;display:grid;place-items:center;width:26px;height:23px;transition:transform .22s}
.tabbar .tico svg{display:block}
.tabbar button.active{color:var(--brand);font-weight:700}
.tabbar button.active .tico{transform:translateY(-1px);filter:drop-shadow(0 0 5px rgba(255,122,24,.85)) drop-shadow(0 0 11px rgba(255,160,50,.5))}

/* 风车：点击转一圈 */
.pwblades{transform-box:fill-box;transform-origin:center}
@keyframes pwspin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.spin .pwblades{animation:pwspin .9s cubic-bezier(.34,.08,.24,1)}

/* 大门：点击打开 */
.doors path{transform-box:fill-box;transition:transform .42s cubic-bezier(.34,.08,.24,1)}
.doors .dl{transform-origin:left center}
.doors .dr{transform-origin:right center}
.gate-open .doors .dl{transform:scaleX(.07)}
.gate-open .doors .dr{transform:scaleX(.07)}

/* 宫格里的线性图标 */
.svgico{color:var(--brand)}
.svgico svg{width:26px;height:26px}

/* 底栏未读红点 */
.tabbar .tdot{position:absolute;top:-3px;right:-5px;min-width:15px;height:15px;padding:0 3px;border-radius:9px;background:#ff3b30;color:#fff;font-size:9px;font-style:normal;font-weight:700;display:grid;place-items:center;line-height:1}

/* ---------- AI 对话页 ---------- */
.chatwrap{display:flex;flex-direction:column;min-height:100%}
.chathead{padding-bottom:14px}
.chathead .tbar{gap:11px;align-items:center}
.chathead .chaiav{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.24);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.chatttl h1{font-size:17px;margin:0;font-weight:800}
.chatttl p{margin:1px 0 0;font-size:10.5px;opacity:.9;display:flex;align-items:center;gap:5px}
.onlinedot{width:6px;height:6px;border-radius:50%;background:#4be07a;display:inline-block;box-shadow:0 0 6px #4be07a}
.chatbody{flex:1;padding:14px 12px 6px;display:flex;flex-direction:column;gap:13px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%}
.msg.me{flex-direction:row-reverse}
.mav{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:15px;flex-shrink:0}
.bubble{max-width:83%;background:#fff;border-radius:4px 14px 14px 14px;padding:10px 12px;box-shadow:0 1px 6px rgba(0,0,0,.06);font-size:13px;line-height:1.65}
.msg.me .bubble{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:14px 4px 14px 14px;box-shadow:0 2px 8px rgba(255,122,24,.3)}
.bubble p{margin:0}
.bubble p + p{margin-top:6px}
.picks{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.pickcard{display:flex;align-items:center;gap:9px;background:#faf7f4;border-radius:11px;padding:8px;text-align:left;transition:background .16s}
.pickcard:active{background:#f2ece5}
.pico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pmain b{font-size:12px;font-weight:600;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmain i{font-size:10.5px;color:#ff4d00;font-style:normal;font-weight:700}
.parrow{color:#c4c4c4;font-size:14px;flex-shrink:0}
.chatquicks{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 4px}
.chatquicks button{background:#fff;border:1px solid #ffdcbc;color:#a75a10;font-size:11.5px;border-radius:999px;padding:7px 12px}
.chatquicks button:active{background:var(--soft)}
.chatbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;background:#fff;border-top:1px solid var(--line);padding:9px 11px 11px}
.chatbar input{flex:1;min-width:0;border:0;background:#f4f4f4;border-radius:999px;padding:10px 15px;font-size:13px;outline:none}
.chatbar input::placeholder{color:#b5b5b5}
.chatbar .sendbtn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:10px 18px;flex-shrink:0}
.chatbar .sendbtn:active{filter:brightness(.94)}
.typing{display:flex;gap:4px;padding:3px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:#cbbfb2;animation:tb 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* ---------- 消息页 ---------- */
.msgitem{display:flex;gap:11px;background:#fff;border-radius:14px;padding:13px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;transition:transform .16s}
.msgitem:active{transform:scale(.985)}
.msgicon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0;background:#fff2e6}
.msgmain{flex:1;min-width:0}
.msgtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px}
.msgtop b{font-size:13.5px;font-weight:700}
.msgtop span{font-size:10.5px;color:#b9b9b9;flex-shrink:0}
.msgtext{font-size:11.5px;color:var(--sub);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msgitem.unread .msgtop b::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff3b30;margin-left:5px;vertical-align:middle;margin-bottom:2px}

/* ---------- 分类页（侧栏 + 列表） ---------- */
.cattoolbar{position:sticky;top:0;z-index:6;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.045)}
.subtabs{display:flex;background:#fff;padding:2px 4px 0}
.subtabs button{flex:1;position:relative;color:#7a7a7a;font-size:14px;padding:12px 2px;font-weight:600;transition:color .18s}
.subtabs button.active{color:#1f1f1f;font-weight:800}
.subtabs button.active::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:26px;height:3px;border-radius:2px;background:var(--brand)}

.filterrow{display:flex;align-items:center;gap:8px;background:#fff;padding:11px 11px 12px;overflow-x:auto;scrollbar-width:none}
.filterrow::-webkit-scrollbar{display:none}
.filterrow .flabel{font-size:14px;font-weight:800;color:#1f1f1f;flex-shrink:0;margin-right:2px}
.fchip{flex-shrink:0;background:#f2f2f2;color:#585858;font-size:12.5px;border-radius:999px;padding:7px 15px;font-weight:600;transition:background .18s,color .18s}
.fchip.active{background:var(--brand);color:#fff}
.fmore{flex-shrink:0;color:#b0b0b0;font-size:11px;padding:0 1px}

.catgrid{display:grid;grid-template-columns:100px 1fr;background:#fff;align-items:start}
.catrail{border-right:1px solid #f2f2f2;padding:4px 0 14px}
.railitem{display:flex;align-items:center;justify-content:center;gap:3px;width:100%;padding:15px 3px;font-size:12.5px;color:#6f6f6f;border-left:3px solid transparent;transition:color .18s,background .18s}
.railitem.active{color:#1f1f1f;font-weight:800;border-left-color:var(--brand)}
.catlist{padding:6px 10px 18px;min-width:0}

.approw{display:flex;align-items:center;gap:11px;padding:11px 0}
.appicon{width:56px;height:56px;border-radius:13px;display:grid;place-items:center;font-size:27px;flex-shrink:0}
.appmain{flex:1;min-width:0}
.appmain h4{font-size:14.5px;font-weight:700;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1f1f1f}
.appmeta{display:flex;align-items:center;gap:6px;font-size:11px;color:#8d8d8d}
.appmeta .st{color:#ff8f1f;font-weight:700}
.appmeta i{color:#e4e4e4;font-style:normal}

/* WGS-84 ⇄ GCJ-02：浏览器定位和我们的数据都是 WGS-84，高德底图是 GCJ-02 */
const GCJ = (() => {
  const PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;
  const outOfChina = (lat, lng) => !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55);
  const tLat = (x, y) => {
    let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
    r += (20 * Math.sin(y * PI) + 40 * Math.sin(y / 3 * PI)) * 2 / 3;
    r += (160 * Math.sin(y / 12 * PI) + 320 * Math.sin(y * PI / 30)) * 2 / 3;
    return r;
  };
  const tLng = (x, y) => {
    let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
    r += (20 * Math.sin(x * PI) + 40 * Math.sin(x / 3 * PI)) * 2 / 3;
    r += (150 * Math.sin(x / 12 * PI) + 300 * Math.sin(x / 30 * PI)) * 2 / 3;
    return r;
  };
  return function wgs2gcj(lat, lng) {
    if (outOfChina(lat, lng)) return [lat, lng];
    let dLat = tLat(lng - 105, lat - 35);
    let dLng = tLng(lng - 105, lat - 35);
    const radLat = lat / 180 * PI;
    let magic = Math.sin(radLat);
    magic = 1 - EE * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
    dLng = (dLng * 180) / (A / sqrtMagic * Math.cos(radLat) * PI);
    return [lat + dLat, lng + dLng];
  };
})();

const wgs2gcj = (lat, lng) => GCJ(lat, lng);
function gcj2wgs(lat, lng) {
  const g = GCJ(lat, lng);
  return [lat * 2 - g[0], lng * 2 - g[1]];
}

const CITY_INDEX = CITY_DB.map(row => ({
  n: row[0], p: row[1], lat: row[2], lng: row[3],
  ds: row[4].split(';').map(s => {
    const i1 = s.indexOf(','), i2 = s.indexOf(',', i1 + 1);
    return { name: s.slice(0, i1), lat: +s.slice(i1 + 1, i2), lng: +s.slice(i2 + 1) };
  })
}));

const CITY_MAP = new Map(CITY_INDEX.map(c => [c.n, c]));

  const subs = SUB_OVERRIDE[c.n] || {};
  return c.ds.map(d => ({ name: d.name, lat: d.lat, lng: d.lng, sub: subs[d.name] || '' }));
}

/* 按城市生成服务：位置和坐标跟着城市走，其余字段沿用模板 */
const GENERIC_TAIL = ['可上门', '固定线路'];
function buildServices(cityName) {
  const ds = buildDistricts(cityName);
  return BASE_SERVICES.map((s, i) => {
    if (cityName === '杭州') return {...s, geo: GEO[s.id] || [ds[0].lat, ds[0].lng]};
    const d = ds[i % ds.length];
    const tail = s.loc.split(' · ')[1];
    const suffix = GENERIC_TAIL.includes(tail) ? ' · ' + tail : '';
    return {
      ...s,
      loc: `${cityName} · ${d.name}${suffix}`,
      geo: [+(d.lat + ((i * 37) % 9 - 4) * 0.0009).toFixed(5),
            +(d.lng + ((i * 53) % 9 - 4) * 0.0009).toFixed(5)]
    };
  });
}

  if (!isOpenCity(name)) return false;
  curCity = name;
  DISTRICTS = buildDistricts(name);
  services = buildServices(name);
  curArea = DISTRICTS[0].name;
  placeMode = 'manual';
  return true;
}

function haversine(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* GPS 模式用真实坐标，手动模式用所选行政区中心点 */
function anchorPos() {
  if (placeMode === 'gps' && userPos) return [userPos.lat, userPos.lng];
  const d = DISTRICTS.find(x => x.name === curArea) || DISTRICTS[0];
  return [d.lat, d.lng];
}

  return r && r.cat ? s.cat === r.cat : true;
}

  if (!railMatch(s, railSel)) return false;

  const q = query.toLowerCase();
  return [s.title, s.merchant, s.cat, s.desc, s.loc, TYPE_LABEL[s.type]]

}

  else if (chipSel === 'cheap') list = list.filter(s => s.price <= 300);

  if (adv.price === 'low')       list = list.filter(s => s.price < 200);
  else if (adv.price === 'mid')  list = list.filter(s => s.price >= 200 && s.price <= 400);
  else if (adv.price === 'high') list = list.filter(s => s.price > 400);
  if (adv.score) list = list.filter(s => s.score >= adv.score);
  if (adv.dist)  list = list.filter(s => distTo(s) <= adv.dist);

  if (sortMode === 'near')      list = [...list].sort((a, b) => distTo(a) - distTo(b));
  else if (sortMode === 'hot')  list = [...list].sort((a, b) => b.sold - a.sold);
  else if (sortMode === 'rank') list = [...list].sort((a, b) => b.score - a.score || b.sold - a.sold);
  return list;
}

  if (/价|便宜|优惠|券|多少钱|预算/.test(text)) {

    return {say:'预算有限的话，这几个都在 300 元以内，性价比不错：', picks:list};

function render() {
  const full = locOpen || busTrack || routeOpen || mapOpen;
  const keep = full ? 0 : (scrollMemo[tab] || 0);
  tabbarEl.style.display = full ? 'none' : '';

  if (!routeOpen && routeMapObj) { routeMapObj.remove(); routeMapObj = null; }
  if (!mapOpen && mapObj) { mapObj.remove(); mapObj = null; }

  tabbarEl.innerHTML = TABS.map(t => {
    const n = t.id === 'msg' ? unreadCount() : 0;
    return `
    <button data-tab="${t.id}" class="${t.id===tab?'active':''}" aria-current="${t.id===tab?'page':'false'}">
      <span class="tico">${t.svg}${n ? `<i class="tdot">${n}</i>` : ''}</span>${t.label}
    </button>`;
  }).join('');

  let html = '';
  if (mapOpen)             html = pageMap();
  else if (busTrack)       html = pageBusTrack();
  else if (routeOpen)      html = pageRoute();
  else if (locOpen)        html = pageLocation();
  else if (tab === 'ai')   html = pageChat();
  else if (tab === 'cat')  html = pageCat();
  else if (tab === 'msg')  html = pageMsg();
  else                     html = pageMine();

  scrollEl.innerHTML = html;
  scrollEl.scrollTop = keep;

  // 地图要在 DOM 就位之后再初始化
  if (mapOpen)   setTimeout(initMapPage, 0);
  if (routeOpen) setTimeout(initRouteMap, 0);

  // 分类页搜索框
  const s = document.getElementById('search');
  if (s) {
    s.addEventListener('input', updateFeed);
    s.addEventListener('keydown', e => { if (e.key === 'Enter') s.blur(); });
  }

  // 选择位置页的搜索框（只刷新列表，保住输入法）
  const ls = document.getElementById('locsearch');
  if (ls) {
    ls.addEventListener('input', e => { locQuery = e.target.value; updateLocPane(); });
    ls.addEventListener('keydown', e => { if (e.key === 'Enter') ls.blur(); });
  }

  // AI 对话框
  const ci = document.getElementById('chatinput');
  if (ci) {
    ci.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); const v = ci.value; ci.value = ''; sendChat(v); }
    });
  }
  if (!full && tab === 'ai') scrollEl.scrollTop = scrollEl.scrollHeight;
}

/* 后端地址：默认连本机的真实项目（127.0.0.1:3101），可用 ?api= 覆盖 */
const API_BASE = (() => {

  catch (e) { return 'http://127.0.0.1:3101'; }

async function apiCall(method, path, body) {
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, 4000);
  try {
    const res = await fetch(API_BASE + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      signal: ctrl ? ctrl.signal : undefined
    });
    clearTimeout(timer);
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      return { ok: false, offline: false, error: (data && data.error) || ('HTTP ' + res.status) };
    }
    return { ok: true, data };
  } catch (e) {
    clearTimeout(timer);
    return { ok: false, offline: true, error: '连不上后端' };
  }
}

async function syncWithServer(silent) {
  const fav = await apiCall('GET', '/api/favorites');
  if (!fav.ok) {
    apiOnline = false;
    if (tab === 'mine' || busTrack) render();
    if (!silent) toast('后端没连上，先存在本浏览器');
    return false;
  }
  apiOnline = true;
  if (Array.isArray(fav.data)) { favLines = fav.data; persistFavLocal(); }

  const fb = await apiCall('GET', '/api/feedback');
  if (fb.ok && Array.isArray(fb.data)) {
    feedbacks = fb.data.map(f => ({
      line: f.category || '校车',
      text: f.content || '',
      time: f.createdAt ? new Date(f.createdAt).toLocaleString('zh-CN', { hour12: false }) : '',
      status: f.status || ''
    }));
    persistFbLocal();
  }
  if (tab === 'mine' || busTrack) render();
  if (!silent) toast('已连接后端，收藏和反馈会同步');
  return true;
}

function homePos() {
  if (homeLoc) return [homeLoc.lat, homeLoc.lng];
  return anchorPos();                       // 没设过就用当前区域中心
}

function stopsGeo(line) {
  const base = geoOf(line);
  return (line.stops || []).map(d => [base[0] + d.d[0], base[1] + d.d[1]]);
}

function routeLegs(gs) {
  let sum = 0;
  for (let i = 0; i < gs.length - 1; i++) sum += haversine(gs[i], gs[i + 1]);
  return sum;
}

/* 对每条线路，找离家最近的上车站（不含终点校），按步行距离排序 */
function recommendRoute() {
  const h = homePos();
  return services
    .filter(s => s.type === 'bus' && s.stops && s.stops.length > 1)
    .map(line => {
      const gs = stopsGeo(line);
      let best = null;
      for (let i = 0; i < line.stops.length - 1; i++) {
        const km = haversine(h, gs[i]);
        if (!best || km < best.km) best = { i, km, stop: line.stops[i] };
      }
      return { line, gs, best };
    })
    .filter(r => r.best)
    .sort((a, b) => a.best.km - b.best.km);
}

/* ================= 地图（高德瓦片 + Leaflet） ================= */
const TILE_URL = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}';
const TILE_OPTS = { subdomains: ['1', '2', '3', '4'], maxZoom: 18, minZoom: 3 };

function makeBaseMap(el, opts) {
  const map = L.map(el, Object.assign({
    zoomControl: false, attributionControl: false
  }, opts || {}));
  L.tileLayer(TILE_URL, TILE_OPTS).addTo(map);
  return map;
}

function schoolPos() {
  if (schoolLoc) return [schoolLoc.lat, schoolLoc.lng];
  const recs = recommendRoute();
  if (recs.length) {
    const gs = stopsGeo(recs[0].line);
    return gs[gs.length - 1];
  }
  return homePos();
}

function saveSchool() {
  try {
    if (schoolLoc) localStorage.setItem(SCHOOL_KEY, JSON.stringify(schoolLoc));
    else localStorage.removeItem(SCHOOL_KEY);

}

function nearestDistrict(lat, lng) {
  let best = null;
  for (const d of DISTRICTS) {
    const km = haversine([lat, lng], [d.lat, d.lng]);
    if (!best || km < best.km) best = { d, km };
  }
  return best;
}

function updateMapPickLabel() {
  const name = document.getElementById('mappickname');
  const sub  = document.getElementById('mappicksub');
  if (!name || !mapPickPos) return;
  const near = nearestDistrict(mapPickPos[0], mapPickPos[1]);
  name.textContent = near ? `${curCity} · ${near.d.name}` : '已选点';
  if (sub) {
    sub.textContent = `${mapPickPos[0].toFixed(5)}, ${mapPickPos[1].toFixed(5)}` +
      (near ? ` · 距${near.d.name}中心 ${fmtDist(near.km)}` : '');
  }
}

function drawBusStops(map) {
  services.filter(s => s.type === 'bus').forEach(s => {
    const gs = stopsGeo(s);
    L.polyline(gs.map(p => wgs2gcj(p[0], p[1])), {
      color: '#ff7a18', weight: 3, opacity: .5, dashArray: '7 7'
    }).addTo(map);
    gs.forEach((p, i) => {
      const last = i === gs.length - 1;
      L.circleMarker(wgs2gcj(p[0], p[1]), {
        radius: last ? 6 : 4.5, color: '#fff', weight: 2,
        fillColor: last ? '#2e9e63' : '#ff7a18', fillOpacity: 1
      }).bindTooltip(s.stops[i].n, { direction: 'top' }).addTo(map);
    });
  });
}

function initMapPage() {
  const el = document.getElementById('mapcanvas');
  if (!el) return;
  if (typeof L === 'undefined') {
    el.innerHTML = '<div class="mapfail">地图组件没加载成功<br><small>请确认 vendor/leaflet/ 目录存在，并用 http 打开页面</small></div>';
    return;
  }
  if (mapObj) { mapObj.remove(); mapObj = null; }

  if (!mapPickPos) mapPickPos = mapMode === 'home' ? homePos() : schoolPos();
  const center = wgs2gcj(mapPickPos[0], mapPickPos[1]);

  mapObj = makeBaseMap(el, { tap: true }).setView(center, 15);
  drawBusStops(mapObj);

  mapPickLayer = L.marker(center, { draggable: true }).addTo(mapObj);
  mapPickLayer.on('dragend', e => {
    const p = e.target.getLatLng();
    mapPickPos = gcj2wgs(p.lat, p.lng);
    updateMapPickLabel();
  });

  mapObj.on('click', e => {
    mapPickPos = gcj2wgs(e.latlng.lat, e.latlng.lng);
    mapPickLayer.setLatLng(e.latlng);
    updateMapPickLabel();
  });

  if (userPos) {
    L.circleMarker(wgs2gcj(userPos.lat, userPos.lng), {
      radius: 7, color: '#fff', weight: 3, fillColor: '#2f7cf6', fillOpacity: 1
    }).bindTooltip('我的位置', { direction: 'top' }).addTo(mapObj);
  }

  updateMapPickLabel();
  setTimeout(() => { if (mapObj) mapObj.invalidateSize(); }, 120);
}

function initRouteMap() {
  const el = document.getElementById('routemap');
  if (!el) return;
  if (typeof L === 'undefined') {
    el.innerHTML = '<div class="mapfail small">地图组件未加载</div>';
    return;
  }
  if (routeMapObj) { routeMapObj.remove(); routeMapObj = null; }

  const h = homePos();
  const pts = [wgs2gcj(h[0], h[1])];
  const recs = recommendRoute();
  if (recs.length) {
    const r = recs[0];
    stopsGeo(r.line).slice(r.best.i).forEach(p => pts.push(wgs2gcj(p[0], p[1])));
  }

  const map = makeBaseMap(el, {
    dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, tap: false, touchZoom: false
  });
  if (pts.length > 1) {
    L.polyline(pts, { color: '#ff7a18', weight: 4, opacity: .9 }).addTo(map);
    L.circleMarker(pts[pts.length - 1], {
      radius: 7, color: '#fff', weight: 3, fillColor: '#2e9e63', fillOpacity: 1
    }).bindTooltip('学校', { direction: 'top' }).addTo(map);
  }
  L.circleMarker(pts[0], {
    radius: 7, color: '#fff', weight: 3, fillColor: '#ff7a18', fillOpacity: 1
  }).bindTooltip('家', { direction: 'top' }).addTo(map);

  const fit = () => {
    map.invalidateSize();
    if (pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.3));
    else map.setView(pts[0], 15);
  };
  fit();
  setTimeout(fit, 150);
  routeMapObj = map;
}

/* ================= 扫一扫（真实二维码识别） ================= */
let scanStream = null, scanRaf = null, scanCanvas = null;

function stopScan() {
  if (scanRaf) { cancelAnimationFrame(scanRaf); scanRaf = null; }
  if (scanStream) {
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }
}

function scanSheetHTML() {
  return `<h2 id="dt">扫一扫</h2>
    <p class="smeta">对准二维码自动识别，也可以从相册选一张图</p>
    <div class="scanbox"><video id="scanvideo" playsinline muted autoplay></video><i class="scanline"></i></div>
    <p class="scanstatus" id="scanstatus">正在打开摄像头…</p>
    <button class="geobtn" data-scanfile>🖼 从图片识别</button>
    <input type="file" id="scanfile" accept="image/*" hidden>`;
}

function openScanSheet() {
  showSheet(scanSheetHTML());
  bindScanFile();
  startScan();
}

function bindScanFile() {
  const inp = document.getElementById('scanfile');
  if (inp) inp.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) scanFromFile(f);
  });
}

function restartScan() {
  stopScan();
  showSheet(scanSheetHTML());
  bindScanFile();
  startScan();
}

function startScan() {
  const video = document.getElementById('scanvideo');
  const status = document.getElementById('scanstatus');
  if (!video) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    if (status) status.textContent = '这个浏览器不支持调用摄像头，可以用下面的「从图片识别」';
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      scanStream = stream;
      video.srcObject = stream;
      video.play().catch(() => {});
      if (status) status.textContent = '正在识别…把二维码放进框里';
      scanCanvas = document.createElement('canvas');
      const tick = () => {
        if (!scanStream) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA && typeof jsQR !== 'undefined') {
          const w = video.videoWidth, h = video.videoHeight;
          if (w && h) {
            scanCanvas.width = w;
            scanCanvas.height = h;
            const ctx = scanCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, w, h);
            const img = ctx.getImageData(0, 0, w, h);
            const res = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
            if (res && res.data) { handleScanResult(res.data); return; }
          }
        }
        scanRaf = requestAnimationFrame(tick);
      };
      scanRaf = requestAnimationFrame(tick);
    })
    .catch(err => {
      if (status) {
        status.textContent = err && err.name === 'NotAllowedError'
          ? '摄像头权限被拒绝，可以用下面的「从图片识别」'
          : '打不开摄像头（' + ((err && err.name) || '未知原因') + '），可以用下面的「从图片识别」';
      }
    });
}

function handleScanResult(text) {
  stopScan();
  const svc = services.find(s => s.id === text.trim());
  const isUrl = /^https?:\/\//i.test(text.trim());
  showSheet(`<h2 id="dt">识别成功</h2>
    <p class="smeta">共 ${text.length} 个字符</p>
    <div class="scanresult">${esc(text)}</div>
    ${svc ? `<button class="geobtn" style="margin-top:14px" data-scanservice="${svc.id}">打开服务：${esc(svc.title)}</button>` : ''}
    ${isUrl ? `<a class="navbtn" style="margin-top:10px" href="${esc(text.trim())}" target="_blank" rel="noopener">🌐 在浏览器打开</a>` : ''}
    <button class="navbtn" style="margin-top:10px" data-scancopy="${esc(text)}">📋 复制内容</button>
    <button class="geobtn" style="margin-top:10px" data-scanagain>再扫一次</button>`);
}

function scanFromFile(file) {
  const status = document.getElementById('scanstatus');
  if (!file) return;
  if (typeof jsQR === 'undefined') { if (status) status.textContent = '解码库没加载成功'; return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const d = ctx.getImageData(0, 0, c.width, c.height);
    const res = jsQR(d.data, c.width, c.height);
    if (res && res.data) handleScanResult(res.data);
    else if (status) status.textContent = '这张图片里没找到二维码，换一张试试';
  };
  img.onerror = () => { if (status) status.textContent = '图片读取失败'; };
  img.src = URL.createObjectURL(file);
}

/* ================= 发车时刻表 ================= */
const toMin = t => { const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1] || 0); };
const toHM = v => String(Math.floor(v / 60) % 24).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');

function busTimes(start, end, step) {
  const out = [];
  for (let t = toMin(start); t <= toMin(end); t += step) out.push(toHM(t));
  return out;
}

function openTimetable() {

  const am = busTimes(s.dep || '07:10', s.arr || '07:45', 15);
  const pm = busTimes(s.pm || '16:30', toHM(toMin(s.pm || '16:30') + 30), 15);
  showSheet(`<h2 id="dt">发车时刻表</h2>
    <p class="smeta">${esc(s.title.split(' · ')[0])} · 每隔 15 分钟一班</p>
    <div class="placediv" style="padding:6px 4px 9px">早班 · 去学校</div>
    <div class="timegrid">${am.map((t, i) =>
      `<span class="timepill${i === 0 ? ' first' : ''}">${t}</span>`).join('')}</div>
    <div class="placediv" style="padding:16px 4px 9px">晚班 · 放学返程</div>
    <div class="timegrid">${pm.map(t => `<span class="timepill">${t}</span>`).join('')}</div>
    <p class="notice" style="margin-top:16px">时刻按首末班时间推算，实际以线路公告为准</p>`);
}

async function submitFeedback(text) {
  const t = String(text || '').trim();
  if (!t) { toast('先写点什么再提交'); return; }
  if (t.length < 5) { toast('反馈内容请至少写 5 个字'); return; }
  const s = busLine();
  const line = s ? s.title.split(' · ')[0] : '校车';
  overlay.hidden = true;

  const r = await apiCall('POST', '/api/feedback', { category: '校车', content: t });
  if (r.ok) {
    apiOnline = true;
    await syncWithServer(true);
    render();
    toast('反馈已提交到服务端');
    return;
  }
  if (r.offline) {
    feedbacks.unshift({ line, text: t, time: new Date().toLocaleString('zh-CN', { hour12: false }) });
    persistFbLocal();
    render();
    toast('后端没连上，反馈先存在本机');
    return;
  }
  toast(r.error || '提交失败');
}

function copyText(t) {
  const done = () => toast('已复制到剪贴板');
  const fail = () => toast('复制失败，请长按手动复制');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(fail);
  } else {
    try {
      const ta = document.createElement('textarea');
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) { fail(); }
  }
}

/* ================= 校车实时定位 ================= */
function busLine() {
  if (!busTrack) return null;
  return services.find(s => s.id === busTrack.id) || services.find(s => s.type === 'bus');
}

function busStops() {
  const s = busLine();
  const st = (s && s.stops) || [];
  return busTrack && busTrack.rev ? [...st].reverse() : st;
}

function busPos() {
  const n = Math.max(busStops().length - 1, 1);
  const p = busTrack.t * n;
  const seg = Math.min(Math.floor(p), n - 1);
  return { seg, frac: p - seg, n };
}

function stopGeo(stop) {
  const base = geoOf(busLine());
  return [base[0] + stop.d[0], base[1] + stop.d[1]];
}

function busGeoNow() {
  const st = busStops();
  const { seg, frac } = busPos();
  const a = stopGeo(st[seg]);
  const b = stopGeo(st[Math.min(seg + 1, st.length - 1)]);
  return [a[0] + (b[0] - a[0]) * frac, a[1] + (b[1] - a[1]) * frac];
}

function busLiveHTML() {
  const st = busStops();
  const { seg } = busPos();
  const t = busTrack.t;

  if (t <= 0) {
    return `<div class="busstatus">
      <b>等待发车</b>
      <em>上一班已过 9 站 · 本班 ${esc(busLine().dep || '07:10')} 准时发车</em>
    </div>`;
  }
  if (t >= 1) {
    return `<div class="busstatus done">
      <b>已到校</b>
      <em>全程 ${st.length} 站 · 用时约 ${BUS_MINUTES} 分钟 · 跟车老师已确认</em>
      <button class="busagain" data-busreset>↺ 再看一遍</button>
    </div>`;
  }
  const next = st[Math.min(seg + 1, st.length - 1)];
  const km = haversine(busGeoNow(), stopGeo(next));
  return `<div class="busstatus">
    <b>行驶中</b>
    <em>下一站 ${esc(next.n)} · 还有 ${fmtDist(km)} · 已行驶 ${Math.round(t * BUS_MINUTES)} 分钟</em>
  </div>`;
}

function busTimelineHTML() {
  const st = busStops();
  const { seg, frac, n } = busPos();
  const t = busTrack.t;
  const finished = t >= 1;

  const items = st.map((s, j) => {
    const done = finished || (t > 0 && j <= seg);          // 已经过的站
    const cur  = !finished && t > 0 && j === seg + 1;      // 正在前往的站
    const lb = done;                                       // 左侧连线已走过
    const rb = finished || j < seg;                        // 右侧连线已走过
    return `<div class="bstop${done ? ' done' : ''}${cur ? ' cur' : ''}${lb ? ' lb' : ''}${rb ? ' rb' : ''}">
      <span class="bdot">${j + 1}</span>
      <span class="bname">${esc(s.n)}</span>
    </div>`;
  }).join('');

  const bus = (!finished && t > 0)
    ? `<span class="bbus" style="left:${((seg + 0.5 + frac) / n) * 100}%">🚌</span>`
    : '';

  return `<div class="bustl"><div class="bstops">${items}</div>${bus}</div>`;
}

function paintBus() {
  const live = document.getElementById('buslive');
  const tl = document.getElementById('bustl');
  const ck = document.getElementById('buscheck');
  const al = document.getElementById('busalert');
  if (live) live.innerHTML = busLiveHTML();
  if (tl) tl.innerHTML = busTimelineHTML();
  if (ck) ck.innerHTML = busCheckHTML();
  if (al) al.innerHTML = busAlertHTML();
}

/* ---------- 孩子上下车打卡 ---------- */
function simClock(offset = 0) {
  const s = busLine();
  const base = (s.dep || '07:10').split(':');
  const start = (+base[0] || 7) * 60 + (+base[1] || 0);
  const m = start + Math.round(busTrack.t * BUS_MINUTES) + offset;
  return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

function updateBusCheck() {
  if (!busCheck || !busTrack) return;
  if (!busCheck.up && busTrack.t > 0.03) { busCheck.up = true; busCheck.upAt = simClock(0); }
  if (!busCheck.down && busTrack.t >= 1) { busCheck.down = true; busCheck.downAt = busLine().arr || simClock(0); }
}

function busCheckHTML() {
  if (!busCheck) return '';
  const st = busStops();
  const s = busLine();
  const state = busCheck.down ? ['已到校', 'ok'] : busCheck.up ? ['在车上', 'on'] : ['等待上车', 'wait'];
  const row = (done, title, place, time) => `
    <div class="checkrow${done ? ' on' : ''}">
      <span class="ckdot">${done ? '✓' : ''}</span>
      <span class="ckmain"><b>${title}</b><i>${esc(place)}</i></span>
      <em>${time || '—'}</em>
    </div>`;

  return `<div class="buscard">
    <div class="childhead">
      <span class="childav">🧒</span>
      <div class="childtxt"><b>小雨 · 二年级</b><i>跟车老师 ${esc(s.teacher || '李老师')}</i></div>
      <span class="childstate ${state[1]}">${state[0]}</span>
    </div>
    <div class="checklist">
      ${row(busCheck.up, '上车', st[0].n, busCheck.upAt)}
      ${row(busCheck.down, '到校下车', st[st.length - 1].n, busCheck.downAt)}
    </div>
    <p class="checknote">演示：打卡由模拟行驶进度生成，不是真实刷卡记录</p>
  </div>`;
}

/* ---------- 到站提醒 ---------- */
function busAlertHTML() {
  if (!busAlert || !busAlert.fired) return '';
  return `<div class="busalert">
    <span>🔔</span>
    <div>${esc(busAlert.text || '校车即将到站')}</div>
    <button data-alertclose>知道了</button>
  </div>`;
}

function checkBusAlert() {
  if (!busAlert || busAlert.fired || !busTrack) return;
  if (busAlert.lineId && busAlert.lineId !== busTrack.id) return;
  const n = Math.max(busStops().length - 1, 1);
  const target = busAlert.stopIdx / n;
  const minsLeft = (target - busTrack.t) * BUS_MINUTES;
  if (minsLeft <= busAlert.lead && minsLeft > -1.5) fireAlert();
}

function fireAlert() {
  const st = busStops();
  const name = (st[busAlert.stopIdx] || st[st.length - 1]).n;
  const text = `校车还有约 ${busAlert.lead} 分钟到达「${name}」`;
  busAlert.fired = true;
  busAlert.text = text;

  MSGS.unshift({ico:'🔔', title:'到站提醒', text: text + '，请提前到站等候。', time:'刚刚', unread:true});
  toast(text);

  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      new Notification('学鹭伴学 · 到站提醒', { body: text });
    }
  } catch (e) {}
}

function alertSheetHTML() {
  const st = busStops();
  const d = alertDraft;
  return `<h2 id="dt">到站提醒</h2>
    <p class="smeta">校车快到达时提醒你 · 演示环境按模拟行驶时间计算</p>
    <div class="placediv" style="padding:0 4px 9px">提醒站点</div>
    <div class="lcard" style="padding:0;overflow:hidden;margin-bottom:0">
      ${st.map((s, j) => `<button class="placerow${d.stopIdx === j ? ' on' : ''}" data-alertstop="${j}">
        <span class="pico2">📍</span>
        <span class="ptxt"><b>${esc(s.n)}</b><small>第 ${j + 1} 站</small></span>
        ${d.stopIdx === j ? '<span class="pcheck">✓</span>' : ''}
      </button>`).join('')}
    </div>
    <div class="placediv" style="padding:14px 4px 9px">提前多久</div>
    <div class="alertchips">

    </div>
    <button class="geobtn" style="margin-top:16px" data-alerton>开启到站提醒</button>
    ${busAlert ? '<button class="alertoff" data-alertoff>关闭当前提醒</button>' : ''}`;
}

function openBusAlertSheet() {
  const st = busStops();
  alertDraft = busAlert
    ? { stopIdx: busAlert.stopIdx, lead: busAlert.lead }
    : { stopIdx: st.length - 1, lead: 3 };
  document.getElementById('details').innerHTML = alertSheetHTML();
  overlay.hidden = false;
  overlay.querySelector('.sheet').focus();
}

function repaintAlertSheet() {
  if (overlay.hidden) return;
  document.getElementById('details').innerHTML = alertSheetHTML();
  overlay.querySelector('.sheet').focus();
}

function startBusTimer() {
  clearInterval(busTimer);
  busTimer = setInterval(() => {
    if (!busTrack) { clearInterval(busTimer); busTimer = null; return; }
    if (busTrack.hold > 0) { busTrack.hold--; paintBus(); return; }
    if (busTrack.t >= 1) {
      updateBusCheck(); checkBusAlert(); paintBus();   // 到站时再补一次打卡/提醒
      clearInterval(busTimer); busTimer = null; return;
    }
    busTrack.t = Math.min(1, busTrack.t + BUS_STEP);
    updateBusCheck();
    checkBusAlert();
    paintBus();
  }, BUS_TICK);
}

function openBusTrack(id) {
  const s = services.find(x => x.id === id) || services.find(x => x.type === 'bus');
  if (!s) return;
  busTrack = { id: s.id, t: 0, hold: 12, rev: false };
  busCheck = { up: false, down: false, upAt: '', downAt: '' };
  if (busAlert) { busAlert.fired = false; busAlert.text = ''; busAlert.lineId = s.id; }
  overlay.hidden = true;
  render();
  scrollEl.scrollTop = 0;
  startBusTimer();
}

function closeBusTrack() {
  clearInterval(busTimer);
  busTimer = null;
  busTrack = null;
  busCheck = null;
  render();
}

function restartBus() {
  busTrack.t = 0;
  busTrack.hold = 12;
  busCheck = { up: false, down: false, upAt: '', downAt: '' };
  if (busAlert) { busAlert.fired = false; busAlert.text = ''; }
  paintBus();
  startBusTimer();
}

/* ================= 事件 ================= */
/* 注意：<button data-loc> 这种不带值的属性，dataset.loc 是空字符串 ""，
   直接用 if (btn.dataset.loc) 判断会永远是假，必须用 key in dataset */
const has = (el, k) => !!(el && el.dataset && k in el.dataset);

document.addEventListener('click', e => {
  const btn = e.target.closest('button');

  // 关闭弹层
  if (e.target.id === 'closeBtn' || e.target === overlay) { closeDetail(); return; }

  // 底部导航
  if (btn?.dataset.tab) { switchTab(btn.dataset.tab); return; }

  // 左侧竖栏
  if (btn?.dataset.rail) {
    railSel = btn.dataset.rail;
    render();
    return;
  }

  // 顶部排序
  if (btn?.dataset.sort) {
    sortMode = btn.dataset.sort;
    render();
    return;
  }

  // 次级筛选
  if (btn?.dataset.chip !== undefined) {
    chipSel = btn.dataset.chip;
    render();
    return;
  }

  if (has(btn, 'morefilter')) { showSheet(advSheetHTML()); return; }
  if (btn?.dataset.advp !== undefined) { adv.price = btn.dataset.advp; repaintAdvSheet(); return; }
  if (btn?.dataset.advs !== undefined) { adv.score = Number(btn.dataset.advs); repaintAdvSheet(); return; }
  if (btn?.dataset.advd !== undefined) { adv.dist = Number(btn.dataset.advd); repaintAdvSheet(); return; }
  if (has(btn, 'advapply')) { overlay.hidden = true; render(); toast(`筛选后 ${catList().length} 项`); return; }
  if (has(btn, 'advreset')) { adv = { price: '', score: 0, dist: 0 }; repaintAdvSheet(); return; }

  if (has(btn, 'sync')) { syncWithServer(false); return; }

  // 扫一扫
  if (has(btn, 'scan')) { openScanSheet(); return; }
  if (has(btn, 'scanfile')) { document.getElementById('scanfile').click(); return; }
  if (has(btn, 'scanagain')) { restartScan(); return; }
  if (btn?.dataset.scanservice) { closeDetail(); openDetail(btn.dataset.scanservice); return; }
  if (btn?.dataset.scancopy !== undefined) { copyText(btn.dataset.scancopy); return; }

  // 收藏 / 反馈 / 更多
  if (has(btn, 'bustbl')) { openTimetable(); return; }
  if (btn?.dataset.fbquick) {
    const ta = document.getElementById('fbtext');
    if (ta) { ta.value = ta.value ? ta.value + '；' + btn.dataset.fbquick : btn.dataset.fbquick; ta.focus(); }
    return;
  }
  if (has(btn, 'fbsubmit')) {
    const ta = document.getElementById('fbtext');
    submitFeedback(ta ? ta.value : '');
    return;
  }
  if (btn?.dataset.copy !== undefined) { copyText(btn.dataset.copy); overlay.hidden = true; return; }
  if (btn?.dataset.copystops !== undefined) { copyText(btn.dataset.copystops); return; }

  // AI 快捷问句
  if (btn?.dataset.quick) { sendChat(btn.dataset.quick); return; }

  // 发送消息
  if (has(btn, 'send')) {
    const el = document.getElementById('chatinput');
    const v = el ? el.value : '';
    if (el) el.value = '';
    sendChat(v);
    return;
  }

  // 点击消息：打开详情并标记已读
  if (e.target.closest('[data-msg]')) {
    openMsgDetail(Number(e.target.closest('[data-msg]').dataset.msg));
    return;
  }

  // 搜索按钮
  if (has(btn, 'search')) {
    updateFeed();
    toast(query ? `搜索「${query}」` : '请输入关键词');
    return;
  }

  // 顶部小图标
  if (has(btn, 'msgbtn')) { switchTab('msg'); return; }
  if (has(btn, 'mine')) { switchTab('mine'); return; }

  // 校车实时定位
  if (btn?.dataset.mapopen) { openMapPicker(btn.dataset.mapopen); return; }
  if (has(btn, 'mapback')) { closeMapPicker(); return; }
  if (has(btn, 'mapconfirm')) {
    const p = mapPickPos || homePos();
    const near = nearestDistrict(p[0], p[1]);
    const label = near ? `${near.d.name} · 地图选点` : '地图选点';
    if (mapMode === 'home') {
      homeLoc = { name: label, lat: +p[0].toFixed(5), lng: +p[1].toFixed(5), src: 'map' };
      saveHome();
    } else if (mapMode === 'school') {
      schoolLoc = { name: label, lat: +p[0].toFixed(5), lng: +p[1].toFixed(5) };
      saveSchool();
    } else if (near) {
      curArea = near.d.name;
      placeMode = 'manual';
      locOpen = false;
    }
    closeMapPicker();
    toast(mapMode === 'area' && near
      ? `已把当前区域设为 ${near.d.name}`
      : `已设为${mapMode === 'home' ? '家' : '学校'}：${label}`);
    return;
  }
  if (has(btn, 'mapgps')) {
    if (!navigator.geolocation) { toast('当前浏览器不支持定位'); return; }
    toast('正在定位…');
    navigator.geolocation.getCurrentPosition(
      pos => {
        userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const g = wgs2gcj(userPos.lat, userPos.lng);
        if (mapObj) {
          mapObj.setView(g, 16);
          L.circleMarker(g, { radius: 7, color: '#fff', weight: 3, fillColor: '#2f7cf6', fillOpacity: 1 })
            .bindTooltip('我的位置', { direction: 'top' }).addTo(mapObj);
          L.circleMarker(g, { radius: 22, color: '#2f7cf6', weight: 2, fillOpacity: .12 }).addTo(mapObj);
        }
        toast(`已定位 · 精度约 ${Math.round(pos.coords.accuracy)} 米`);
      },
      err => toast(err.code === 1 ? '定位权限被拒绝' : '定位失败，可手动拖动图钉'),
      { enableHighAccuracy: true, timeout: 8000 }
    );
    return;
  }
  if (btn?.dataset.goroute) { routeOpen = true; render(); scrollEl.scrollTop = 0; return; }
  if (has(btn, 'routeback')) { routeOpen = false; render(); return; }
  if (has(btn, 'sethome')) { openHomeSheet(); return; }
  if (has(btn, 'sethomegps')) { setHomeFromGPS(); return; }
  if (btn?.dataset.homearea) {
    const d = DISTRICTS.find(x => x.name === btn.dataset.homearea);
    if (d) {
      homeLoc = { name: d.name, lat: d.lat, lng: d.lng, src: 'area' };
      saveHome();
      overlay.hidden = true;
      render();
      toast(`已把「家」设在 ${d.name}`);
    }
    return;
  }
  if (btn?.dataset.bustrack) { openBusTrack(btn.dataset.bustrack); return; }
  if (has(btn, 'busback')) { closeBusTrack(); return; }
  if (has(btn, 'busmap')) { openBusMap(); return; }
  if (has(btn, 'busreset')) { restartBus(); return; }
  if (has(btn, 'busrev')) {
    busTrack.rev = !busTrack.rev;
    restartBus();
    render(); startBusTimer();
    toast(busTrack.rev ? '已切换到返程方向' : '已切换到来程方向');
    return;
  }
  if (btn?.dataset.busact) {
    const act = btn.dataset.busact;
    if (act === '地图') { openBusMap(); return; }
    if (act === '提醒') { openBusAlertSheet(); return; }
    if (act === '收藏') {
      toggleFav(busTrack.id);
      render();
      return;
    }
    if (act === '反馈') { openFeedback(); return; }
    if (act === '更多') { openMore(); return; }
    return;
  }

  // 到站提醒设置
  if (btn?.dataset.alertstop !== undefined) {
    alertDraft.stopIdx = Number(btn.dataset.alertstop);
    repaintAlertSheet();
    return;
  }
  if (btn?.dataset.alertlead !== undefined) {
    alertDraft.lead = Number(btn.dataset.alertlead);
    repaintAlertSheet();
    return;
  }
  if (has(btn, 'alerton')) {
    busAlert = {
      lineId: busTrack ? busTrack.id : null,
      stopIdx: alertDraft.stopIdx,
      lead: alertDraft.lead,
      fired: false,
      text: ''
    };
    try { localStorage.setItem(ALERT_KEY, JSON.stringify({lineId: busAlert.lineId, stopIdx: busAlert.stopIdx, lead: busAlert.lead})); } catch (e) {}
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'default') Notification.requestPermission();
    } catch (e) {}
    overlay.hidden = true;
    const nm = (busStops()[busAlert.stopIdx] || {}).n || '终点站';
    toast(`已开启：到达「${nm}」前 ${busAlert.lead} 分钟提醒`);
    return;
  }
  if (has(btn, 'alertoff')) {
    busAlert = null;
    try { localStorage.removeItem(ALERT_KEY); } catch (e) {}
    overlay.hidden = true;
    paintBus();
    toast('已关闭到站提醒');
    return;
  }
  if (has(btn, 'alertclose')) {
    if (busAlert) { busAlert.fired = false; busAlert.text = ''; busAlert.stopIdx = -1; }
    paintBus();
    return;
  }

  // 定位 / 选择位置页
  if (has(btn, 'loc')) {
    locOpen = true; locTab = 'addr'; locQuery = '';
    render(); scrollEl.scrollTop = 0;
    return;
  }
  if (has(btn, 'locback')) { locOpen = false; locQuery = ''; render(); return; }
  if (btn?.dataset.loctab) { locTab = btn.dataset.loctab; locQuery = ''; render(); return; }
  if (has(btn, 'geolocate')) { locateMe(); return; }
  if (has(btn, 'map')) { openMapPicker('area'); return; }
  if (btn?.dataset.letter) {
    const sec = document.getElementById('sec-' + btn.dataset.letter);
    if (sec) sec.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }
  if (btn?.dataset.loccity) {
    const c = btn.dataset.loccity;
    if (c === curCity) { locTab = 'area'; locQuery = ''; render(); return; }
    if (applyCity(c)) {
      locTab = 'area'; locQuery = '';
      render();
      toast(`已切换到 ${c} · ${DISTRICTS.length} 个区可选`);
    } else {
      toast(`「${c}」暂未开通，可在“推荐城市”里换一个`);
    }
    return;
  }
  if (btn?.dataset.area) {
    curArea = btn.dataset.area;
    placeMode = 'manual';
    locOpen = false; locQuery = '';
    render();
    toast(`已切换到 ${curArea}`);
    return;
  }

  // 保存意向
  if (btn?.dataset.save) {
    const id = btn.dataset.save;
    const added = !intents.includes(id);
    intents = added ? [...intents, id] : intents.filter(x => x !== id);
    persist();

    if (btn.classList.contains('cta')) {
      btn.classList.toggle('saved', added);
      btn.textContent = added ? '已保存意向 · 再次点击移除' : '♡ 保存预约意向';
      toast(added ? '已保存到本地预约意向' : '已移除预约意向');
    } else {
      toast(added ? '已保存到本地预约意向' : '已移除预约意向');
      render();
    }
    return;
  }

  // 打开详情
  const card = e.target.closest('[data-id]');
  if (card) { openDetail(card.dataset.id); return; }
});

// 键盘
document.addEventListener('keydown', e => {
  if (!overlay.hidden) {
    if (e.key === 'Escape') { closeDetail(); return; }
    if (e.key === 'Tab') {
      const f = overlay.querySelectorAll('button');
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  } else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-id]')) {
    e.preventDefault();
    openDetail(e.target.dataset.id);
  }
});

// 记录滚动位置
scrollEl.addEventListener('scroll', () => { scrollMemo[tab] = scrollEl.scrollTop; }, {passive:true});

render();
// 启动时静默连一次后端：通了就用服务端的收藏与反馈
syncWithServer(true);
</script>
</body></html>
